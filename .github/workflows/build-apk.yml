name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, release-exe, arena/01a0dc6b-byazenm]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build web and Capacitor debug APK
        run: |
          cd client
          npm install --legacy-peer-deps
          npm run build
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init Cbopka com.cbopka.app --web-dir dist || true
          npx cap add android || true
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Cbopka-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
